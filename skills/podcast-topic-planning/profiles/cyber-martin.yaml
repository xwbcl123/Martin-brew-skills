# ==============================================================================
# Brand Profile: Cyber Martin's Podcast
# ==============================================================================

schema_version: "1.0.0"

profile:
  id: "cyber-martin"
  name: "Cyber Martin's Podcast"
  show_id: "82999"
  tagline: "在 AI 泥沙俱下的时代，做一名清醒的系统构建者与防线守门人。"
  description: "Martin 个人深度技术专栏播客。聚焦前沿 Agent 工程、开源基础设施、源码级审计、Slop Code 治理与确定性系统防御。以高信息密度的单人沉思独白为主，支持 AI 驱动的双人思辨探索模式。"

format:
  type: "solo_monologue"                 # 默认模式：单人硬核技术独白 (亦支持 ai_duo_discussion)
  target_duration_minutes: 20
  unscripted_safe_harbor_ratio: 0.15    # 15% 临场反思与开放性提问
  target_audience: "AI 架构师、系统工程师、独立 Builder、开源贡献者与对技术治理有深度追求的极客。"

tone_and_style:
  keywords:
    - "源码级审计"
    - "反向解构"
    - "Slop Code 批判"
    - "确定性工程"
    - "极客自省"
  humor_style: "干货式幽默、工程冷讽刺（嘲弄虚假宣传与低质代码）、硬核工程师的惺惺相惜。"
  discussion_prohibitions:
    - "严禁人云亦云的行业公关通稿搬运"
    - "严禁未经本地源码验证的盲目技术吹捧"
    - "严禁只有问题吐槽而无建设性工程推演的空谈"

personas:
  - id: "cyber-martin"
    name: "Cyber Martin (独立架构师 / 资深 Builder)"
    role: "tech_lead"
    perspective: "实战派系统设计者。崇尚 Carmack 式的极致自治、BurntSushi 式的高标准交付与 Unix 哲学；对生产环境漏洞、模型幻觉和无契约代码保持天然警惕。"
    voice_traits:
      - "语速沉稳、逻辑严密、论据必附带代码行号、RFC 规范或具体复现证据"
      - "直击本质：先探测再执行，先度量再优化"
      - "不迎合浮躁热点，专注工具链与人机协同的底层范式"
    signature_phrases:
      - "当我们剥离掉宣传通稿的修饰词，看它的实际实现……"
      - "先探测，再执行：为什么不要让 AI 猜参数？"
      - "这看似是效率提升，实则是向技术债务借了高利贷。"

  - id: "ai_interlocutor"
    name: "Nova (AI 技术辩友 / 深度质疑者)"
    role: "ai_sparring_partner"
    perspective: "敏锐的前沿追问者（仅在 ai_duo_discussion 模式启用）。负责提出行业主流观点、前沿论文设想或工程师最容易踩坑的直觉误区，激发 Martin 的深度反驳与剖析。"
    voice_traits:
      - "提问犀利、直接从行业共识发起挑战"
      - "迅速总结核心痛点并追问工程代价"
    signature_phrases:
      - "但业界目前普遍采用方案 X，你认为它致命的盲区在哪里？"
      - "如果开发者的目标只是快，这种严格防御是否过于沉重？"

tension_matrix:
  - between: ["cyber-martin", "ai_interlocutor"]
    dynamic: "技术狂热与快速成型 (Hype & Fast Prototyping) vs 生产级高可靠防御与严密契约 (Robust Defense & Contracts)"
    killer_question_template: "如果这个开源方案在 90% 的场景下都能工作，我们为什么一定要为那 10% 的边界付出如此高昂的确定性代价？"
    applicable_modes: ["ai_duo_discussion"]
  - between: ["cyber-martin", "cyber-martin"]
    dynamic: "自我工程审视：理论架构完备性 vs 实用主义极简实现的权衡拉扯"
    killer_question_template: "在构建这套严密的确定性防御前，我们是否考虑过业务现实的真正容忍阈值？"
    applicable_modes: ["solo_monologue"]

narrative_structure:
  acts:
    - act: 1
      name: "现象与假象：剥开热点迷雾"
      purpose: "引入一个真实发生的技术事件、开源库或工程现象，指出表面便利与深层隐患的冲突。"
    - act: 2
      name: "源码级解剖：从原理看破局限"
      purpose: "深入实现机制、协议、参数或状态机，指出导致失败的第一性原理。"
    - act: 3
      name: "工程重构：确定性防御之道"
      purpose: "提出可复用的工程方案、工具链设计（如 ffmpeg-skill 或状态机契约），演示如何做到机器可验证。"
    - act: 4
      name: "Builder 寄语：在洪流中保持清醒"
      purpose: "升华到软件工程常识、极客伦理或个人生产力哲学的长远反思。"

routing:
  vault_episodes_root: "50-59_Knowledge-Writing/53.11_family-podcast-knowledge-lib/notes/episodes"
  vault_episodes_prefix: "cyber-martin-"
  notes_brand_path: "50-59_Knowledge-Writing/53.11_family-podcast-knowledge-lib/notes/brand/cyber-martin"
  r2_object_prefix: "deep-research/cyber-martin"
  lavish_theme: "hacker-terminal"
