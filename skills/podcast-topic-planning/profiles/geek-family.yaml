# ==============================================================================
# Brand Profile: 极客家庭 (Geek Family Podcast)
# ==============================================================================

schema_version: "1.0.0"

profile:
  id: "geek-family"
  name: "极客家庭 (Geek Family Podcast)"
  show_id: "82408"
  tagline: "生活是一场持续 Debug 的冒险，家庭是最好的分布式协同网络。"
  description: "海外英式国际教育、欧洲真实生活碰撞、青少年科技启蒙与极客家庭共同成长的对谈式播客。拒绝说教与伪装，呈现鲜活的生活切片、教育博弈与认知跃迁。"

format:
  type: "trio_dialogue"                 # 三人固定对谈模式
  target_duration_minutes: 45
  unscripted_safe_harbor_ratio: 0.20    # 20% 未排练即兴碰撞区
  target_audience: "关注国际化教育、海外多元文化生活、亲子科技启蒙与家庭协同进化的父母与教育者。"

tone_and_style:
  keywords:
    - "真实生活切片"
    - "温情但有碰撞"
    - "极客隐喻"
    - "反思性成长"
    - "英式教育细节"
  humor_style: "冷幽默自嘲、父母在现实困境中的手忙脚乱、少年童言无忌的直白吐槽。"
  discussion_prohibitions:
    - "严禁爹味说教与虚伪的正能量升华"
    - "严禁脱离家庭一手证据的空洞鸡汤"
    - "严禁将孩子塑造成完美的提线木偶"

personas:
  - id: "martin"
    name: "Martin (爸爸 / 架构师视角)"
    role: "host_moderator"
    perspective: "系统推演者与规则解构者。习惯用工程、网络、Agent 与系统架构视角拆解生活难题；擅长控场与深层提问，但常被母子两人的现实体验'打脸'。"
    voice_traits:
      - "习惯从宏观系统或逻辑边界切入问题"
      - "热衷于寻找日常细节背后的隐喻与哲学反思"
      - "温和、包容，具备极客特有的好奇心与自嘲精神"
    signature_phrases:
      - "从系统架构的角度来看，这本质上是一个……"
      - "如果做一次彻底的威胁建模，最坏情况会是怎样？"
      - "Feynman，那一刻你的真实体感是什么？"

  - id: "spring"
    name: "Spring (妈妈 / 行政战地指挥)"
    role: "reality_anchor"
    perspective: "现实主义执行者与家庭秩序压舱石。关注具体的人、具体的后勤摩擦与生活细节（证件、行李、温饱、安全）；对 Martin 的空头理论持有清醒的怀疑与务实纠偏。"
    voice_traits:
      - "节奏明快、直击要害、细节记忆极其精确"
      - "充满关切与战地统筹的果断"
      - "善于揭穿表面秩序下的狼狈与真实代价"
    signature_phrases:
      - "架构再好，拉杆箱上不了校车你怎么办？"
      - "你们只看到诗和远方，后勤全是我在打仗！"
      - "我当时最担心的一件事其实是……"

  - id: "feynman"
    name: "Feynman (极客少年 / 一线冒险家)"
    role: "youth_perspective"
    perspective: "一手亲历者与原生态观察员（11岁少年）。身处英式学校第一线，带来第一人称的肉身体感；反叛、幽默、热衷科技与户外探险，拒绝成人世界的繁文缛节。"
    voice_traits:
      - "语言直截了当、画面感极强、充满少年视角特有的无厘头与灵动"
      - "对形式主义无感，对真实好玩、刺激或不公的事物高度敏锐"
    signature_phrases:
      - "其实大人根本不知道，我们当时在想的是……"
      - "那不可怕，真正可怕的是……"
      - "手机没了之后，反而觉得世界变大了！"

tension_matrix:
  - between: ["martin", "spring"]
    dynamic: "系统架构推演 vs 战地现实落地摩擦（理论派老爸被务实派老妈无情'打假'）"
    killer_question_template: "Spring，当 Martin 在推演这套完美方案时，你在现实落地中面临的最大行政摩擦是什么？"

  - between: ["martin", "feynman"]
    dynamic: "老父亲的科技认知期待 vs 少年野生探索与反抗（父子间的思想切磋与代际真实视角）"
    killer_question_template: "Feynman，爸爸跟你讲的那些宏观逻辑，你在实际生活现场最真实的想法到底是什么？"

  - between: ["spring", "feynman"]
    dynamic: "母爱安全感保护 vs 少年渴望脱离大人掌控的冒险天性（放手与边界的博弈）"
    killer_question_template: "Feynman，当妈妈为你做足全套保护准备时，你内心最渴望自己尝试突破的是哪一点？"

narrative_structure:
  acts:
    - act: 1
      name: "前哨破局：日常秩序失控与现实意外"
      purpose: "揭示临行或事件开端的意外后勤摩擦与生活真实荒诞，制造悬念与反差。"
    - act: 2
      name: "认知展开：多方视角对冲与规则重塑"
      purpose: "展现关键情境下的真实生活切片与多方互动分歧，带来鲜活认知碰撞。"
    - act: 3
      name: "高潮考验：极限现实博弈与观念交锋"
      purpose: "呈现高压或极端情境下的决策困境、肉身体验与多视角深度张力。"
    - act: 4
      name: "极客复盘：家庭协同进化与认知沉淀"
      purpose: "三方角色共同沉淀，从生活挑战升华到成长契约、系统性安全感与认知跃迁。"

routing:
  vault_episodes_root: "50-59_Knowledge-Writing/53.11_family-podcast-knowledge-lib/notes/episodes"
  vault_episodes_prefix: "geek-family-"
  notes_brand_path: "50-59_Knowledge-Writing/53.11_family-podcast-knowledge-lib/notes/brand/geek-family"
  r2_object_prefix: "deep-research/geek-family"
  lavish_theme: "editorial-warm"
