    <linearGradient id="signal-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16FFBB"/>
      <stop offset="0.52" stop-color="#29DDDA"/>
      <stop offset="1" stop-color="#37A7E7"/>
    </linearGradient>
    <mask id="signal-cut">
