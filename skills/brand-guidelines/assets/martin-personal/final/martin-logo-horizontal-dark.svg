<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Martin horizontal personal Logo reverse</title>
  <desc id="desc">Balanced Signal M and an artistic Martin wordmark for dark backgrounds.</desc>
