version: 1

models:
  sonnet-4.6:
    provider: anthropic
    best_for: [writing, coding, general]
  opus-4.8:
    provider: anthropic
    best_for: [deep_reasoning, planning, writing]
  opus-4.6:
    provider: anthropic
    best_for: [writing, synthesis]
  deepseek:
    provider: deepseek
    capacity_note: high-volume; ccs should export deepseek-v4-pro[1m] for 1M context accounting
    best_for: [general_bulk, repetitive_tasks]
  glm2:
    provider: zhipu
    notes: "Overseas GLM profile through ccs use glm2; default big model should be glm-5.2[1m]."
    best_for: [general, backup]
  minimax:
    provider: minimax
    capacity_note: "ccs should export MiniMax-M3[1m] for 1M context accounting."
    best_for: [general, backup]
  gpt-5.6-sol:
    provider: openai
    supported_efforts: [medium, high, xhigh]
    best_for: [coding, master, review, final_integration]
  gpt-5.6-terra:
    provider: openai
    default_effort: medium
    supported_efforts: [medium, high, xhigh]
    best_for: [general, everyday_coding]
  gpt-5.3-codex-spark:
    provider: openai
    default_effort: high
    supported_efforts: [high]
    best_for: [fast_coding, mechanical_changes]
  gemini-3.5-flash:
    provider: google
    best_for: [fast_chores, shorts, fast_writing]
  gemini-3.1-pro:
    provider: google
    best_for: [general, synthesis]
  composer-2.5:
    provider: cursor
    best_for: [fast_programming]

preference_groups:
  general_bulk:
    primary_model: deepseek
    fallback_models: [glm2, minimax]
  writing_quality:
    primary_model: sonnet-4.6
    fallback_models: [opus-4.8, opus-4.6]
  high_reasoning:
    primary_model: opus-4.8
    fallback_models: [gpt-5.6-sol, sonnet-4.6]
  fast_chores:
    primary_model: gemini-3.5-flash
    fallback_models: [gpt-5.3-codex-spark, composer-2.5]
  fast_coding:
    primary_model: gpt-5.3-codex-spark
    fallback_models: [composer-2.5, sonnet-4.6]
  final_review:
    primary_model: gpt-5.6-sol
    primary_effort: xhigh
    fallback_models: [opus-4.8]
